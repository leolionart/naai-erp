name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: naai_erp
          POSTGRES_PASSWORD: naai_erp
          POSTGRES_DB: naai_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naai_erp -d naai_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://naai_erp:naai_erp@localhost:5432/naai_erp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:release
      - run: pnpm check
      - run: pnpm db:check
      - run: pnpm db:migrate
      - run: pnpm --filter @naai-erp/database test
      - run: pnpm --filter @naai-erp/api exec vitest run --maxWorkers=1
        env:
          RUN_DB_INTEGRATION: "1"
      - run: pnpm --filter @naai-erp/worker test
        env:
          RUN_DB_INTEGRATION: "1"
      - run: pnpm --filter @naai-erp/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
