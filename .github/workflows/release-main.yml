name: Release main images

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  checks:
    name: Packaging contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      short_sha: ${{ steps.release.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify release and Compose contracts
        run: |
          node scripts/verify-release-workflow.mjs
          node scripts/verify-compose.mjs
      - name: Prepare release matrix
        id: release
        shell: bash
        run: |
          echo "matrix=$(node -e "const m=require('./scripts/release-images.json'); process.stdout.write(JSON.stringify({include:m.images}))")" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.name }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/leolionart/${{ matrix.name }}:main
            ghcr.io/leolionart/${{ matrix.name }}:sha-${{ needs.checks.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/leolionart/naai-erp
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ needs.checks.outputs.short_sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=sha-${{ needs.checks.outputs.short_sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
