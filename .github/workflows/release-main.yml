name: Release main images

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "db/migrations/**"
      - "docker/**"
      - "deploy/**"
      - "compose*.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig*.json"
      - "scripts/release-images.json"
      - "docs/api/openapi-v1.json"

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  checks:
    name: Packaging contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      short_sha: ${{ steps.release.outputs.short_sha }}
      has_images: ${{ steps.release.outputs.has_images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect affected images
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/contracts/**'
              - 'packages/domain/**'
              - 'docker/Dockerfile.api'
              - 'docs/api/openapi-v1.json'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
            web:
              - 'apps/web/**'
              - 'packages/contracts/**'
              - 'docker/Dockerfile.web'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
            worker:
              - 'apps/worker/**'
              - 'packages/contracts/**'
              - 'packages/domain/**'
              - 'docker/Dockerfile.worker'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig*.json'
            migrate:
              - 'packages/database/**'
              - 'db/migrations/**'
              - 'docker/Dockerfile.migrate'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
            manifest:
              - 'scripts/release-images.json'
      - name: Verify release and Compose contracts
        run: |
          node scripts/verify-release-workflow.mjs
          node scripts/verify-compose.mjs
      - name: Prepare release matrix
        id: release
        shell: bash
        env:
          API_CHANGED: ${{ steps.changes.outputs.api }}
          WEB_CHANGED: ${{ steps.changes.outputs.web }}
          WORKER_CHANGED: ${{ steps.changes.outputs.worker }}
          MIGRATE_CHANGED: ${{ steps.changes.outputs.migrate }}
          MANIFEST_CHANGED: ${{ steps.changes.outputs.manifest }}
        run: |
          echo "matrix=$(RELEASE_MANIFEST="$(cat scripts/release-images.json)" node scripts/select-release-images.mjs)" >> "$GITHUB_OUTPUT"
          if [[ "$MANIFEST_CHANGED" == "true" || "$API_CHANGED" == "true" || "$WEB_CHANGED" == "true" || "$WORKER_CHANGED" == "true" || "$MIGRATE_CHANGED" == "true" ]]; then echo "has_images=true" >> "$GITHUB_OUTPUT"; else echo "has_images=false" >> "$GITHUB_OUTPUT"; fi
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.name }}
    needs: checks
    if: needs.checks.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/leolionart/${{ matrix.name }}:latest
            ghcr.io/leolionart/${{ matrix.name }}:main
            ghcr.io/leolionart/${{ matrix.name }}:sha-${{ needs.checks.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/leolionart/naai-erp
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ needs.checks.outputs.short_sha }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          build-args: |
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VERSION=sha-${{ needs.checks.outputs.short_sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
