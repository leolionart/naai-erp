name: Release main images

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: true

jobs:
  checks:
    name: Required checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.release.outputs.matrix }}
      short_sha: ${{ steps.release.outputs.short_sha }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: naai_erp
          POSTGRES_PASSWORD: naai_erp
          POSTGRES_DB: naai_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naai_erp -d naai_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://naai_erp:naai_erp@localhost:5432/naai_erp
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm db:check
      - run: pnpm db:migrate
      - run: pnpm --filter @naai-erp/database test
      - run: pnpm --filter @naai-erp/api test
        env:
          RUN_DB_INTEGRATION: "1"
      - run: pnpm --filter @naai-erp/worker test
        env:
          RUN_DB_INTEGRATION: "1"
      - run: pnpm --filter @naai-erp/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - name: Prepare release matrix
        id: release
        shell: bash
        run: |
          echo "matrix=$(node -e "const m=require('./scripts/release-images.json'); process.stdout.write(JSON.stringify({include:m.images}))")" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.name }}
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.checks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/leolionart/${{ matrix.name }}:main
            ghcr.io/leolionart/${{ matrix.name }}:sha-${{ needs.checks.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/leolionart/naai-erp
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
